name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Sync deps
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check proxima_api tests
      - name: Run tests
        run: uv run python -m pytest -q

  web:
    name: Web (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  scheduled-workflow-browser:
    name: Scheduled workflow browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@9ffc9ce4183e2bb421a52b1ebd1860eeabce138e # v1.7.3
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Expose Chrome for regression discovery
        run: |
          chrome_path="${{ steps.chrome.outputs.chrome-path }}"
          sudo ln -sfn "$chrome_path" /usr/local/bin/google-chrome
          command -v google-chrome
          google-chrome --version
      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --locked
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run disposable real-browser regression
        run: npm run test:e2e:schedules

  fresh-install:
    name: Fresh-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --locked
      - name: Verify isolated first boot
        run: PROXIMA_SMOKE_IN_PROCESS=1 bash scripts/smoke-fresh
